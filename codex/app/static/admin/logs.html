<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>晋中信息学院｜管理后台｜日志中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/ui.css?v=20260324-notice-1" />
</head>
<body class="page-hidden admin-body" data-page="logs">
  <div class="auth-checking" id="authChecking">正在校验登录状态…</div>
  <div class="noise" aria-hidden="true"></div>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <p class="badge">晋中信息学院</p>
        <h1>自习室管理后台</h1>
        
      </div>
      <nav class="admin-menu">
        <a href="/admin/dashboard" data-admin-nav="dashboard">仪表盘</a>
        <a href="/admin/stores" data-admin-nav="stores">门店管理</a>
        <a href="/admin/resources" data-admin-nav="resources">资源中心</a>
        <a href="/admin/orders" data-admin-nav="orders">订单管理</a>
        <a href="/admin/users" data-admin-nav="users">用户管理</a>
        <a href="/admin/notices" data-admin-nav="notices">公告管理</a>
        <a href="/admin/config" data-admin-nav="config">系统配置</a>
        <a href="/admin/logs" data-admin-nav="logs">日志中心</a>
      </nav>
    </aside>

    <div class="admin-main">
      <header class="admin-topbar">
        <div>
          <p class="badge">日志中心</p>
          <h2 class="admin-page-title">管理员操作日志</h2>
          
        </div>
        <div class="admin-top-actions">
          <div class="admin-user-chip">当前用户：<strong id="currentUserText">-</strong></div>
          <div class="admin-user-chip">当前角色：<strong id="currentRoleText">-</strong></div>
          <button id="refreshPageBtn" class="btn btn-primary">刷新页面</button>
          <button id="logoutBtn" class="btn">退出登录</button>
        </div>
      </header>

      <main class="admin-content">
        <section class="page-card">
          <div class="section-title"><h2>筛选条件</h2></div>
          <div class="form-grid two">
            <label>
              <span>模块</span>
              <input id="logModuleInput" type="text" placeholder="例如 stores / seats / orders" />
            </label>
            <label>
              <span>管理员</span>
              <input id="logOperatorKeywordInput" type="text" placeholder="请输入管理员名称或编号" />
            </label>
            <label>
              <span>请求方法</span>
              <select id="logMethodInput">
                <option value="">全部方法</option>
                <option value="GET">GET</option>
                <option value="POST">POST</option>
                <option value="PUT">PUT</option>
                <option value="DELETE">DELETE</option>
              </select>
            </label>
            <label>
              <span>开始时间</span>
              <input id="logStartTimeInput" type="datetime-local" />
            </label>
            <label>
              <span>结束时间</span>
              <input id="logEndTimeInput" type="datetime-local" />
            </label>
          </div>
          <div class="hero-actions" style="margin-top:14px;">
            <button id="loadOperationLogsBtn" class="btn btn-primary">查询日志</button>
            <button id="prevOperationLogsBtn" class="btn">上一页</button>
            <button id="nextOperationLogsBtn" class="btn">下一页</button>
          </div>
          <p id="operationLogPageInfo" class="hint">暂无日志数据</p>
        </section>

        <section class="page-card">
          <div class="section-title"><h2>日志列表</h2></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>操作人</th>
                  <th>角色</th>
                  <th>IP</th>
                  <th>模块</th>
                  <th>方法</th>
                  <th>请求路径</th>
                  <th>状态码</th>
                  <th>耗时</th>
                  <th>时间</th>
                </tr>
              </thead>
              <tbody id="operationLogTbody"></tbody>
            </table>
          </div>
        </section>

        <section class="page-card compact">
          <h2>操作反馈</h2>
          <div id="pageFeedback" class="result result-info">暂无操作结果</div>
        </section>
      </main>
    </div>
  </div>

  <script src="/static/js/texts.js?v=20260324-notice-1"></script>
  <script src="/static/js/admin-common.js?v=20260324-notice-1"></script>
  <script src="/static/js/admin/admin-modules.js?v=20260324-notice-1"></script>
  <script src="/static/js/admin/admin-logs.js?v=20260323-2"></script>
</body>
</html>
