<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>晋中信息学院｜学生端｜通知中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/student.css?v=20260324-notice-1" />
</head>
<body class="page-hidden">
  <div class="auth-checking" id="authChecking">正在校验登录状态…</div>
  <div class="noise" aria-hidden="true"></div>

  <header class="hero">
    <div>
      <p class="badge">通知中心</p>
      <h1>查看系统通知</h1>
      <p class="subtitle">当前用户：<span data-student-user>-</span></p>
    </div>
    <div class="hero-actions student-page-nav">
      <a href="/student" class="btn" data-student-nav>预约首页</a>
      <a href="/student/notices" class="btn" data-student-nav>公告中心</a>
      <a href="/student/notifications" class="btn" data-student-nav>通知中心</a>
      <button class="btn btn-primary" data-student-refresh>刷新页面</button>
      <button class="btn" data-student-logout>退出登录</button>
    </div>
  </header>

  <main class="grid">
    <section class="card wide-card">
      <div class="section-head">
        <div>
          <h2>通知列表</h2>
          <p id="notificationMeta" class="meta">暂无通知</p>
        </div>
        <div class="notification-toolbar">
          <button id="refreshNotificationsBtn" class="btn">刷新通知</button>
          <button id="readAllNotificationsBtn" class="btn btn-primary">全部标记为已读</button>
        </div>
      </div>
      <div id="notificationList" class="notification-list">
        <div class="notification-empty">暂无通知</div>
      </div>
    </section>

    <section class="card compact wide-card">
      <h2>操作反馈</h2>
      <div id="pageFeedback" class="output" style="margin:0;">暂无操作结果</div>
    </section>
  </main>

  <script src="/static/js/texts.js?v=20260324-notice-1"></script>
  <script src="/static/js/student-page-common.js?v=20260324-notice-1"></script>
  <script src="/static/js/student-notifications.js?v=20260324-notice-1"></script>
</body>
</html>
